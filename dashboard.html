<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Recap</title>

    <link rel="stylesheet" href="dashbord.css">
</head>

<body>

<div class="sidebar">
    <h3>Admin </h3>
    <ul>
        <li>Dashboard</li>
        <li class="active">Recap</li>
        <li>Projects</li>
        <li>Campaigns</li>
    </ul>
</div>

<div class="main">

    <div class="topbar">
        <input type="text" class="search" placeholder="Search here">
        <div class="filter">Filter Periode</div>
    </div>

    <h1>Recap</h1>
    <p class="subtitle">Hi, admin . Welcome back!</p>

    <div class="card">
        <h3>Data Cucian</h3>

        <table class="table">
            <tr>
                <td contenteditable="true">balmon</td>
                <td contenteditable="true">Jan 24, 2026</td>
                <td contenteditable="true">250k</td>
                <td><span class="status progress">In Progress</span></td>
            </tr>
            <tr>
                <td contenteditable="true">Natalia</td>
                <td contenteditable="true">Mar 10, 2026</td>
                <td contenteditable="true">350k</td>
                <td><span class="status complete">Complete</span></td>
            </tr>
            <tr>
                <td contenteditable="true">andrew</td>
                <td contenteditable="true">Apr 15, 2026</td>
                <td contenteditable="true">400k</td>
                <td><span class="status pending">Pending</span></td>
            </tr>
        </table>

    </div>

</div>

<script src="js/dashbord.js"></script>

</body>
</html>
