<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Formulir Pendaftaran</title>
  <link rel="stylesheet" href="booking.css">
</head>
<body>
  <form action="proses_pendaftaran.php" method="post">
    <legend>Form Booking Cuci Mobil</legend>
    <label for="nama">Nama Lengkap:</label>
    <input type="text" id="nama" name="nama" required>
    <label for="email">Email:</label>
    <input type="email" id="email" name="email" required>
    <label for="plat mobil">Plat Mobil:</label>
    <input type="text" id="plat mobil" name="plat mobil" required>
    <label for="jenis mobil">jenis mobil:</label>
    <input type="text" id="jenis mobil" name="jenis" required>
    <label for="telepon">Nomor Telepon:</label>
    <input type="tel" id="telepon" name="telepon" pattern="[0-9]{10,13}" 
    required>

    <label for="menu">Pilih Menu:</label>
    <select id="menu" name="menu" required>
    <option value="">pilih menu </option>
    <option value="cuci_umum">Cuci Umum</option>
    <option value="cuci_premium">Cuci Premium</option>
    <option value="cuci_luar">Salon Luar</option>
    <option value="wax_butter">Wax Butter</option>
    <option value="wax_spray">Wax Spray</option>
    <option value="foging">Foging</option>
    <option value="paket_gantenk">Paket Gantenk</option>
    </select>

    <label>Jenis Kelamin:</label>
    <div class="radio-group">
      <input type="radio" id="pria" name="gender" value="Pria" required>
      <label for="pria">Pria</label>
      <input type="radio" id="wanita" name="gender" value="Wanita">
      <label for="wanita">Wanita</label>
    </div>

    <label for="tanggal">Tanggal Booking</label>
    <input type="date" id="tanggal" name="tanggal" required>

    <label for="jam">jam</label>
    <input type="time" id="jam" name="jam" required>

    <label for="alamat">Alamat:</label>
    <textarea id="alamat" name="alamat" rows="4" required></textarea>


    <div class="buttons">
      <input type="reset" value="Reset">
      <input type="submit" value="Booking">
    </div>
  </form>
</body>
</html>
