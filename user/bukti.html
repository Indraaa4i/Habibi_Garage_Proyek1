<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bukti Pembayaran - HABIBI GARAGE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Inter', sans-serif;
        }
        .receipt-card {
            max-width: 600px;
            margin: 50px auto;
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .status-badge {
            font-size: 0.9rem;
            padding: 8px 16px;
            border-radius: 50px;
        }
        .dotted-line {
            border-top: 2px dashed #dee2e6;
            margin: 20px 0;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card receipt-card">
        <div class="card-body p-5">
            <div class="text-center mb-4">
                <div class="mb-2">
                    <span class="badge bg-success status-badge text-uppercase">Pembayaran Berhasil</span>
                </div>
                <h4 class="fw-bold mb-1">HABIBI GARAGE</h4>
                <p class="text-muted small">ID Transaksi: #KS-9928374</p>
            </div>

            <div class="text-center my-4">
                <p class="text-muted mb-0">Total Bayar</p>
                <h2 class="fw-bold text-dark">Rp 400.000</h2>
            </div>

            <div class="dotted-line"></div>

            <div class="row mb-3">
                <div class="col-6 text-muted">Metode Pembayaran</div>
                <div class="col-6 text-end fw-semibold">E-Wallet (OVO)</div>
            </div>
            <div class="row mb-3">
                <div class="col-6 text-muted">Waktu Transaksi</div>
                <div class="col-6 text-end fw-semibold">16 Apr 2026, 08:45</div>
            </div>
            <div class="row mb-3">
                <div class="col-6 text-muted">Nama Pelanggan</div>
                <div class="col-6 text-end fw-semibold">Budi Santoso</div>
            </div>

            <div class="dotted-line"></div>

            <div class="mb-4">
                <h6 class="fw-bold mb-3">Detail paket</h6>
                <div class="d-flex justify-content-between mb-2">
                    <span>Paket Gantenk</span>
                    <span class="fw-semibold">Rp 400.000</span>
                </div>
                <div class="d-flex justify-content-between mb-2">
                    <span>waktu pencucian</span>
                    <span class="fw-semibold">jam 14.00</span>
                </div>
            </div>

            <div class="d-grid gap-2 mt-5">
                <button class="btn btn-primary btn-lg fw-bold" onclick="window.print()">Cetak Bukti</button>
                <a href="#" class="btn btn-outline-secondary">Kembali ke Beranda</a>
            </div>
        </div>
    </div>
</div>

</body>
</html>
